name: Golden Set Regression

# 触发条件：
# 1. PR / push 修改了 prompt 文件
# 2. 修改了 eval 模块或 deep_analyzer 服务（可能影响 LLM 调用路径）
# 3. 手动触发（workflow_dispatch）
on:
  pull_request:
    paths:
      - 'backend_api/app/prompts/**'
      - 'prompts/**'
      - 'review_analyzer/eval/**'
      - 'backend_api/app/services/deep_analyzer.py'
      - 'backend_api/app/services/prompt_registry.py'
      - 'backend_api/app/core/aspect_taxonomy.py'
  push:
    branches: [main, develop]
    paths:
      - 'backend_api/app/prompts/**'
      - 'review_analyzer/eval/**'
      - 'backend_api/app/services/deep_analyzer.py'
  workflow_dispatch:
    inputs:
      prompt_version:
        description: '要评测的 prompt 版本'
        required: false
        default: 'v2.3'
      min_accuracy:
        description: '最低准确率（0-1，v2.3 基线 0.946，留 1.6pp 安全垫）'
        required: false
        default: '0.93'

jobs:
  golden-set-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas openai python-dotenv

      - name: Check OPENAI_API_KEY 配置
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "❌ 仓库未配置 OPENAI_API_KEY secret，跳过本次评测"
            echo "在 Settings → Secrets and variables → Actions 添加该 secret"
            exit 1
          fi

      - name: 运行 Golden Set v1.0 评测（家具家居基线）
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPT_VERSION: ${{ github.event.inputs.prompt_version || 'v2.3' }}
          MIN_ACCURACY: ${{ github.event.inputs.min_accuracy || '0.93' }}
        run: |
          python3 -m review_analyzer.eval.run \
            --prompt-version "$PROMPT_VERSION" \
            --golden-set v1.0 \
            --min-accuracy "$MIN_ACCURACY" \
            --max-failure-rate 0.05 \
            --json-out eval_result_v1.0.json

      - name: 运行 Golden Set v1.1 多品类评测
        if: hashFiles('data/golden_set/v1.1/**/ai_annotated_*.csv') != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPT_VERSION: ${{ github.event.inputs.prompt_version || 'v2.3' }}
        run: |
          python3 -m review_analyzer.eval.run \
            --prompt-version "$PROMPT_VERSION" \
            --golden-set v1.1 \
            --all-categories \
            --min-accuracy 0.85 \
            --max-failure-rate 0.10 \
            --json-out eval_result_v1.1.json

      - name: 上传评测结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-set-eval-results
          path: eval_result*.json
          retention-days: 30
