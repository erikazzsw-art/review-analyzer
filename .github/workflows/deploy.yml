name: Deploy to Production

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  ci-gate:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate Secrets
        run: |
          missing=""
          if [ -z "${{ secrets.ECS_HOST }}" ]; then missing="$missing ECS_HOST"; fi
          if [ -z "${{ secrets.ECS_USER }}" ]; then missing="$missing ECS_USER"; fi
          if [ -z "${{ secrets.ECS_SSH_KEY }}" ]; then missing="$missing ECS_SSH_KEY"; fi
          if [ -z "${{ secrets.ECS_DEPLOY_PATH }}" ]; then missing="$missing ECS_DEPLOY_PATH"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi
          echo "All required secrets are present"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config << 'ENDCONFIG'
          Host ecs
            HostName ECS_HOST_PLACEHOLDER
            User ECS_USER_PLACEHOLDER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          ENDCONFIG
          sed -i "s/ECS_HOST_PLACEHOLDER/${{ secrets.ECS_HOST }}/" ~/.ssh/config
          sed -i "s/ECS_USER_PLACEHOLDER/${{ secrets.ECS_USER }}/" ~/.ssh/config
          echo "SSH config written:"
          cat ~/.ssh/config | sed 's/IdentityFile.*/IdentityFile ***/'

      - name: Deploy
        run: |
          ssh ecs << 'DEPLOY_SCRIPT'
            set -e
            cd ${{ secrets.ECS_DEPLOY_PATH }}

            echo "[1/4] Tagging current images for rollback..."
            # Capture images into variable to avoid pipeline exit-code issues
            IMAGES=$(docker compose ps --format '{{.Image}}' 2>/dev/null || true)
            if [ -n "$IMAGES" ]; then
              echo "$IMAGES" | while read -r img; do
                [ -n "$img" ] && docker tag "$img" "${img}:rollback" 2>/dev/null || true
              done
            fi

            echo "[2/4] Pulling latest code (develop)..."
            git fetch origin develop
            git reset --hard origin/develop

            echo "[3/4] Building and restarting containers..."
            docker compose up -d --build --remove-orphans 2>&1

            echo "[4/4] Waiting for services to stabilize..."
            sleep 10
            echo "Deploy completed."
          DEPLOY_SCRIPT

      - name: Health Check
        id: healthcheck
        run: |
          MAX_RETRIES=5
          RETRY_DELAY=10

          # Check API health (via docker compose exec — container port 8000, not exposed to host)
          # api container is a slim Python image without curl; use Python urllib instead
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(ssh ecs "cd ${{ secrets.ECS_DEPLOY_PATH }} && docker compose exec -T api python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode()==200 else 1)\" && echo 200 || echo 000")
            if [ "$STATUS" = "200" ]; then
              echo "API health check passed (attempt $i)"
              break
            fi
            if [ "$i" = "$MAX_RETRIES" ]; then
              echo "::error::API health check failed after $MAX_RETRIES attempts"
              echo "api_healthy=false" >> $GITHUB_OUTPUT
              exit 1
            fi
            sleep $RETRY_DELAY
          done

          # Check frontend (via docker compose exec — container port 3000, not exposed to host)
          # frontend container is a node image without wget; use node http instead
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(ssh ecs "cd ${{ secrets.ECS_DEPLOY_PATH }} && docker compose exec -T frontend node -e \"require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\" && echo 200 || echo 000")
            if [ "$STATUS" = "200" ]; then
              echo "Frontend health check passed (attempt $i)"
              break
            fi
            if [ "$i" = "$MAX_RETRIES" ]; then
              echo "::error::Frontend health check failed after $MAX_RETRIES attempts"
              echo "frontend_healthy=false" >> $GITHUB_OUTPUT
              exit 1
            fi
            sleep $RETRY_DELAY
          done

          echo "All health checks passed"

      - name: Rollback on Failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          ssh ecs << 'ENDSSH'
            set -e
            cd ${{ secrets.ECS_DEPLOY_PATH }}

            echo "Health check failed — rolling back to previous version"

            # Revert git to previous commit
            git reset --hard HEAD~1

            # Rebuild with previous code
            docker compose up -d --build --remove-orphans

            sleep 10
          ENDSSH

      - name: Notify Email - Success
        if: success()
        run: |
          curl -sf -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "ClueAI Deploy <deploy@clueai-reviewlens.com>",
              "to": "${{ secrets.DEPLOY_NOTIFY_EMAIL }}",
              "subject": "✅ 部署成功 - ClueAI",
              "html": "<h2>部署成功</h2><p><b>分支</b>: ${{ github.ref_name }}<br><b>提交</b>: ${{ github.sha }}<br><b>触发者</b>: ${{ github.actor }}<br><b>时间</b>: '"$(date -u '+%Y-%m-%d %H:%M UTC')"'</p>"
            }' || echo "Email notification failed (non-critical)"

      - name: Notify Email - Failure
        if: failure()
        run: |
          curl -sf -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "ClueAI Deploy <deploy@clueai-reviewlens.com>",
              "to": "${{ secrets.DEPLOY_NOTIFY_EMAIL }}",
              "subject": "❌ 部署失败 - ClueAI",
              "html": "<h2>部署失败</h2><p><b>分支</b>: ${{ github.ref_name }}<br><b>提交</b>: ${{ github.sha }}<br><b>触发者</b>: ${{ github.actor }}<br><b>日志</b>: <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">查看详情</a></p>"
            }' || echo "Email notification failed (non-critical)"
