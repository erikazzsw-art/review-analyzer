upstream clueai_frontend {
    server frontend:3000;
}

upstream clueai_api {
    server api:8100;
}

server {
    listen 80;
    server_name clueai-reviewlens.com www.clueai-reviewlens.com app.clueai-reviewlens.com api.clueai-reviewlens.com;
    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name clueai-reviewlens.com www.clueai-reviewlens.com app.clueai-reviewlens.com;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/clueai-reviewlens.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clueai-reviewlens.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://clueai_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl http2;
    server_name api.clueai-reviewlens.com;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/clueai-reviewlens.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clueai-reviewlens.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://clueai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
