services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend_api/Dockerfile
    env_file:
      - .env
    environment:
      API_ENV: production
      API_CORS_ORIGINS: https://clueai-reviewlens.com,https://www.clueai-reviewlens.com,https://app.clueai-reviewlens.com
      API_COOKIE_DOMAIN: .clueai-reviewlens.com
      API_COOKIE_SECURE: "true"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    expose:
      - "8100"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: workers/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.clueai-reviewlens.com
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://api.clueai-reviewlens.com
    depends_on:
      - api
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    depends_on:
      - frontend
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    env_file:
      - .env
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
    command: >
      certbot certonly
      --webroot
      --webroot-path=/var/www/certbot
      --email "$${LETSENCRYPT_EMAIL}"
      --agree-tos
      --no-eff-email
      --keep-until-expiring
      -d clueai-reviewlens.com
      -d www.clueai-reviewlens.com
      -d app.clueai-reviewlens.com
      -d api.clueai-reviewlens.com
    restart: "no"

  streamlit:
    profiles:
      - legacy
    build:
      context: ..
      dockerfile: backend_api/Dockerfile
    env_file:
      - .env
    command:
      - streamlit
      - run
      - review_analyzer/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    expose:
      - "8501"
    restart: unless-stopped

volumes:
  redis_data:
  certbot_www:
  letsencrypt:
