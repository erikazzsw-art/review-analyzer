<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClueAI ReviewLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <span class="logo">CA</span>
      <h1 class="title">ClueAI ReviewLens</h1>
    </header>

    <!-- Page status -->
    <section class="status-section">
      <div class="status-row">
        <span class="status-label">当前页面</span>
        <span id="pageTypeBadge" class="badge badge--loading">检测中…</span>
      </div>
      <p id="pageUrl" class="page-url"></p>
    </section>

    <!-- Action -->
    <section class="action-section">
      <button id="scrapeBtn" class="btn btn--primary" disabled>
        📥 抓取评论
      </button>
      <p id="actionHint" class="action-hint"></p>
    </section>

    <!-- Degradation notice (Step 14-1) -->
    <section id="degradeSection" class="degrade-section" hidden>
      <div class="degrade-notice" id="degradeNotice">
        <span class="degrade-icon" id="degradeIcon">⚠️</span>
        <p class="degrade-text" id="degradeText"></p>
      </div>
      <a id="feedbackLink" class="feedback-link" href="#" target="_blank" hidden>
        📋 反馈此页面
      </a>
    </section>

    <!-- Anti-crawl notice (Step 14-2) -->
    <section id="antiCrawlSection" class="anticrawl-section" hidden>
      <div class="anticrawl-notice" id="antiCrawlNotice">
        <span class="anticrawl-icon" id="antiCrawlIcon"></span>
        <div class="anticrawl-content">
          <p class="anticrawl-text" id="antiCrawlText"></p>
          <p class="anticrawl-sub" id="antiCrawlSub" hidden></p>
        </div>
      </div>
    </section>

    <!-- Progress (Step 13) -->
    <section class="progress-section" id="progressSection" hidden>
      <div class="progress-header">
        <span class="progress-label">已抓取</span>
        <span class="progress-count" id="progressCount">0 条</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
      </div>
    </section>

    <!-- Export (Step 13) + Upload (Step 15) -->
    <section class="export-section" id="exportSection" hidden>
      <button id="exportBtn" class="btn btn--secondary">
        📥 导出 CSV
      </button>
      <button id="apiUploadBtn" class="btn btn--upload">
        ☁️ 上传到 ClueAI
      </button>
      <button id="resetBtn" class="btn btn--ghost">
        🗑 清除数据
      </button>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span class="version">v0.1.0</span>
      <a href="https://www.clueai-reviewlens.com" target="_blank" class="footer-link">
        ClueAI ReviewLens
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
