<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClueAI ReviewLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <span class="logo">CA</span>
      <h1 class="title" data-i18n="app_title">ClueAI ReviewLens</h1>
      <button id="langToggle" class="lang-toggle" type="button" title="Switch to English">EN</button>
    </header>

    <!-- Tab switcher (Step 11.5) -->
    <nav class="tab-bar" id="tabBar">
      <button class="tab-btn" data-tab="listing" data-i18n="tab_listing">📊 产品信息</button>
      <button class="tab-btn" data-tab="reviews" data-i18n="tab_reviews">💬 评论</button>
    </nav>

    <!-- Login status (Step 16) -->
    <section class="login-section" id="loginSection">
      <div class="login-row">
        <span class="login-dot" id="loginDot"></span>
        <span class="login-text" id="loginText" data-i18n="login_checking">检测登录状态…</span>
        <button id="loginBtn" class="btn-link" type="button" data-i18n="login_btn" hidden>去登录</button>
      </div>
    </section>

    <!-- ═══ Reviews Tab Content ═══ -->
    <div id="reviewsTabContent" class="tab-content" hidden>
    <!-- Page status -->
    <section class="status-section">
      <div class="status-row">
        <span class="status-label" data-i18n="status_page_label">当前页面</span>
        <span id="pageTypeBadge" class="badge badge--loading" data-i18n="badge_detecting">检测中…</span>
      </div>
      <p id="pageUrl" class="page-url"></p>
    </section>

    <!-- Action -->
    <section class="action-section">
      <button id="scrapeBtn" class="btn btn--primary" disabled data-i18n="scrape_btn">
        📥 抓取评论
      </button>
      <p id="actionHint" class="action-hint"></p>
    </section>

    <!-- Degradation notice (Step 14-1) -->
    <section id="degradeSection" class="degrade-section" hidden>
      <div class="degrade-notice" id="degradeNotice">
        <span class="degrade-icon" id="degradeIcon">⚠️</span>
        <p class="degrade-text" id="degradeText"></p>
      </div>
      <a id="feedbackLink" class="feedback-link" href="#" target="_blank" data-i18n="feedback_link" hidden>
        📋 反馈此页面
      </a>
    </section>

    <!-- Anti-crawl notice (Step 14-2) -->
    <section id="antiCrawlSection" class="anticrawl-section" hidden>
      <div class="anticrawl-notice" id="antiCrawlNotice">
        <span class="anticrawl-icon" id="antiCrawlIcon"></span>
        <div class="anticrawl-content">
          <p class="anticrawl-text" id="antiCrawlText"></p>
          <p class="anticrawl-sub" id="antiCrawlSub" hidden></p>
        </div>
      </div>
    </section>

    <!-- Progress (Step 13) -->
    <section class="progress-section" id="progressSection" hidden>
      <div class="progress-header">
        <span class="progress-label" data-i18n="progress_label">已抓取</span>
        <span class="progress-count" id="progressCount">0</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
      </div>
    </section>

    <!-- Export (Step 13) + Upload (Step 15) -->
    <section class="export-section" id="exportSection" hidden>
      <button id="exportBtn" class="btn btn--secondary" data-i18n="export_btn">
        📥 导出 CSV
      </button>
      <button id="apiUploadBtn" class="btn btn--upload" data-i18n="upload_btn">
        ☁️ 上传到 ClueAI
      </button>
      <button id="resetBtn" class="btn btn--ghost" data-i18n="reset_btn">
        🗑 清除数据
      </button>
    </section>
    </div><!-- end reviewsTabContent -->

    <!-- ═══ Listing Tab Content (Step 11.5) ═══ -->
    <div id="listingTabContent" class="tab-content" hidden>
    <!-- Product name input (user fills manually) -->
    <section class="listing-name-section">
      <label class="listing-label" for="productNameInput" data-i18n="listing_name_label">产品名称</label>
      <input type="text" id="productNameInput" class="listing-name-input"
             placeholder="请输入产品名称（如：XX品牌蓝牙耳机）"
             data-i18n-placeholder="listing_name_placeholder">
    </section>

    <!-- Listing action button -->
    <section class="action-section">
      <button id="listingScrapeBtn" class="btn btn--primary" data-i18n="listing_scrape_btn">
        🔍 提取产品信息
      </button>
      <p id="listingActionHint" class="action-hint"></p>
    </section>

    <!-- Listing preview (collapsible) -->
    <section id="listingPreviewSection" class="listing-preview-section" hidden>
      <details id="listingPreviewDetails" class="listing-details">
        <summary class="listing-summary" data-i18n="listing_preview_title">
          📋 抓取结果预览
        </summary>
        <div id="listingPreviewContent" class="listing-preview-content">
        </div>
      </details>
    </section>

    <!-- Reviews page shortcut -->
    <section id="reviewsLinkSection" class="reviews-link-section" hidden>
      <a id="reviewsPageLink" class="btn btn--secondary reviews-page-link" href="#" target="_blank" rel="noreferrer" data-i18n="reviews_page_link">
        💬 前往评论页抓取
      </a>
    </section>

    <!-- Upload button -->
    <section class="action-section" id="listingUploadSection" hidden>
      <button id="listingUploadBtn" class="btn btn--upload" data-i18n="listing_upload_btn">
        ☁️ 上传到产品管理
      </button>
    </section>

    <!-- Upload success -->
    <section id="listingUploadSuccess" class="listing-success-section" hidden>
      <div class="listing-success-notice">
        <span class="listing-success-icon">✅</span>
        <div>
          <p class="listing-success-text" data-i18n="listing_upload_success">上传成功</p>
          <a id="listingViewProductLink" class="listing-view-link" href="#" target="_blank" data-i18n="listing_view_product">
            查看产品 →
          </a>
        </div>
      </div>
    </section>
    </div><!-- end listingTabContent -->

    <!-- Footer -->
    <footer class="footer">
      <span class="version">v0.3.2</span>
      <a href="https://www.clueai-reviewlens.com" target="_blank" class="footer-link" data-i18n="footer_link">
        ClueAI ReviewLens
      </a>
    </footer>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
