# 户外用品 Aspect Taxonomy Delta 词典 v1.0
# 设计参考: 户外评论数据(钓鱼装备/防雨装备/涉水服/望远镜)+ Shulex outdoor 维度
# 用途: 与 base.yaml 合并后供 extract_taxonomy_generic.py 使用

extends: base.yaml
category: outdoor
category_label: 户外用品

delta_aspects:
  # 防护性能类(户外核心)
  - {key: waterproof, label_zh: 防水性}
  - {key: wind_resistance, label_zh: 防风性}
  - {key: breathability, label_zh: 透气性}
  - {key: temperature_rating, label_zh: 保暖等级}
  # 适配类
  - {key: size_fit, label_zh: 尺寸匹配}
  # 便携性
  - {key: portability, label_zh: 便携性}
  # 望远镜专属
  - {key: optical_clarity, label_zh: 光学清晰度}
  # 钓鱼装备专属
  - {key: tackle_durability, label_zh: 渔具耐用性}
